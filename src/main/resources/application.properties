spring.application.name=gbk-healthcare-backend
server.port=${PORT:5000}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.error.include-message=never

# Short-lived access tokens and persistent, rotating refresh sessions.
app.security.jwt-expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
app.security.refresh-expiration-seconds=${REFRESH_EXPIRATION_SECONDS:2592000}
app.security.cookie-domain=${AUTH_COOKIE_DOMAIN:}
app.security.cookies-secure=${AUTH_COOKIE_SECURE:true}
app.security.cookie-same-site=${AUTH_COOKIE_SAME_SITE:None}
app.security.allowed-origins=${AUTH_ALLOWED_ORIGINS:http://localhost:5173,https://main.d2jr9663g6l11x.amplifyapp.com}

# Gmail SMTP configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}

# SMTP authentication and TLS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Connection timeouts
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
